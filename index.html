<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>World Snaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2140; --pink: #ff4f8b; --pink-d: #d93a72; --cream: #fffdf6; --sky: #8fd3ff;
    --glass: rgba(255, 255, 255, 0.88); --shadow: 0 6px 18px rgba(43, 33, 64, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; color: var(--ink); -webkit-user-select: none; user-select: none; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; cursor: pointer; border: 0; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .pill { position: absolute; background: var(--glass); border-radius: 999px; box-shadow: var(--shadow); padding: 6px 16px; font-weight: 800; }
  #counter { top: max(14px, env(safe-area-inset-top)); left: 16px; font-size: 20px; display: flex; gap: 8px; align-items: center; }
  #topbtns { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px; display: flex; gap: 8px; pointer-events: auto; }
  .hbtn { background: var(--glass); border-radius: 999px; box-shadow: var(--shadow); padding: 6px 16px; font-weight: 800; font-size: 17px; color: var(--ink); }
  .hbtn:hover { background: #fff; }
  #minimap { position: absolute; top: 66px; right: 16px; width: 170px; height: 102px; background: rgba(43, 33, 64, 0.55); border-radius: 14px; box-shadow: var(--shadow); }
  #banner { position: absolute; top: 9%; left: 50%; transform: translate(-50%, -12px); text-align: center; opacity: 0; transition: opacity .5s, transform .5s; }
  #banner.show { opacity: 1; transform: translate(-50%, 0); }
  #banner-street { font-size: clamp(28px, 5vw, 52px); font-weight: 800; color: #fff; text-shadow: 0 3px 0 var(--pink-d), 0 6px 18px rgba(0,0,0,.25); line-height: 1; }
  #banner-city { font-family: Caveat, cursive; font-size: clamp(24px, 3.4vw, 36px); color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #hint { bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 700; white-space: nowrap; transition: opacity 1s; }
  #hint.fade { opacity: 0; }
  body.touch #hint .keys { display: none; }
  body.touch #hint { bottom: 110px; }
  body:not(.touch) #hint .touchy { display: none; }

  #bubble { position: absolute; transform: translate(-50%, -100%); background: #fff; border-radius: 18px; padding: 8px 14px; max-width: min(280px, 70vw); font-size: 15px; font-weight: 600; line-height: 1.25; box-shadow: var(--shadow); opacity: 0; transition: opacity .25s; }
  #bubble.show { opacity: 1; }
  #bubble b { display: block; color: var(--pink-d); font-size: 13px; }
  #bubble::after { content: ''; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); border: 10px solid transparent; border-top-color: #fff; border-bottom: 0; }

  #snapbtn { position: absolute; bottom: max(26px, env(safe-area-inset-bottom)); left: 50%; transform: translate(-50%, 30px) scale(.8); opacity: 0; pointer-events: none; background: var(--pink); color: #fff; border-radius: 999px; padding: 12px 28px 12px 20px; font-size: 24px; font-weight: 800; box-shadow: 0 5px 0 var(--pink-d), var(--shadow); display: flex; align-items: center; gap: 10px; transition: transform .2s, opacity .2s; }
  #snapbtn.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; animation: bob 1.2s ease-in-out infinite; }
  #snapbtn .key { font-size: 13px; background: rgba(255,255,255,.25); border-radius: 6px; padding: 0 6px; }
  body.touch #snapbtn { left: auto; right: 22px; transform: none; }
  body.touch #snapbtn .key { display: none; }
  @keyframes bob { 50% { margin-bottom: 5px; } }
  .cam { width: 26px; height: 20px; border: 3px solid #fff; border-radius: 6px; position: relative; }
  .cam::after { content: ''; position: absolute; width: 8px; height: 8px; border: 3px solid #fff; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); }

  #joy { position: absolute; display: none; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.25); border: 3px solid rgba(255,255,255,.6); }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.85); transform: translate(-50%, -50%); }

  /* selfie */
  #viewfinder { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #viewfinder.show { opacity: 1; }
  #viewfinder::before { content: ''; position: absolute; inset: 18px; border: 4px solid rgba(255,255,255,.85); border-radius: 28px; }
  #viewfinder .rec { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 800; letter-spacing: .1em; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  #polaroid { position: fixed; right: 5vw; bottom: 6vh; width: min(300px, 46vw); transform: translateY(130%) rotate(8deg); transition: transform .6s cubic-bezier(.2,1.4,.4,1); pointer-events: none; filter: drop-shadow(0 10px 20px rgba(0,0,0,.3)); }
  #polaroid { opacity: 0; }
  #polaroid.show { transform: translateY(0) rotate(-4deg); opacity: 1; }
  #polaroid img { width: 100%; display: block; border-radius: 4px; }

  /* modals */
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(43, 33, 64, .55); padding: 16px; z-index: 5; }
  .modal.show { display: flex; }
  .sheet { background: var(--cream); border-radius: 26px; box-shadow: var(--shadow); width: min(920px, 100%); max-height: 100%; overflow: auto; padding: 22px; position: relative; }
  .sheet h2 { margin: 0 0 12px; font-size: 30px; line-height: 1.1; }
  .x { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; background: #efe8f6; font-size: 22px; font-weight: 800; color: var(--ink); }
  #albumgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { aspect-ratio: 540 / 650; border-radius: 6px; overflow: hidden; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.15); cursor: pointer; transition: transform .15s; }
  .card:nth-child(odd) { transform: rotate(-1.5deg); } .card:nth-child(even) { transform: rotate(1.2deg); }
  .card:hover { transform: rotate(0) scale(1.04); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ece6f3; color: #8a7fa0; font-weight: 700; cursor: default; border: 3px dashed #cfc5de; box-shadow: none; }
  .card.empty .q { font-size: 54px; line-height: 1; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 10px; flex-wrap: wrap; }
  .ghost { background: none; color: #8a7fa0; font-weight: 700; text-decoration: underline; }
  .big { background: var(--pink); color: #fff; border-radius: 999px; padding: 10px 26px; font-size: 20px; font-weight: 800; box-shadow: 0 4px 0 var(--pink-d); }
  .big:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-d); }
  .big:disabled { opacity: .6; }
  #bigmap { width: 100%; height: min(56vh, 520px); display: block; background: #4a3d6a; border-radius: 18px; }
  #lightbox { z-index: 6; }
  #lightimg { max-width: min(560px, 92vw); max-height: 88vh; border-radius: 6px; transform: rotate(-2deg); box-shadow: var(--shadow); }

  /* title + ending */
  #title { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 16px; background: linear-gradient(180deg, rgba(143,211,255,.25), rgba(255,111,168,.35)); z-index: 4; transition: opacity .6s; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title h1 { margin: 0; font-size: clamp(56px, 13vw, 128px); line-height: .9; color: #fff; text-shadow: 0 5px 0 var(--pink-d), 0 10px 30px rgba(0,0,0,.25); }
  #title .sub { font-size: clamp(20px, 3.6vw, 30px); font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.3); margin: 8px 0 22px; }
  #title .made { font-family: Caveat, cursive; font-size: clamp(26px, 4.5vw, 40px); color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.35); margin-top: 18px; }
  #ending .sheet { text-align: center; max-width: 720px; }
  #end-body { font-size: 20px; font-weight: 600; margin: 8px auto; max-width: 560px; }
  #end-sign { font-family: Caveat, cursive; font-size: 36px; color: var(--pink-d); }
  #end-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 14px 0; }
  #end-grid img { width: 72px; border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  #end-grid img:nth-child(odd) { transform: rotate(-4deg); } #end-grid img:nth-child(even) { transform: rotate(3deg); }

  .snow { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .snow i { position: absolute; top: -10px; width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .85; animation: fall linear infinite; }
  @keyframes fall { to { transform: translate(30px, 105vh); } }

  @media (max-width: 640px) {
    #minimap { display: none; }
    #counter { font-size: 17px; padding: 5px 12px; }
    .hbtn { font-size: 15px; padding: 5px 12px; }
    #albumgrid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    #hint { font-size: 13px; white-space: normal; width: calc(100% - 32px); text-align: center; border-radius: 16px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="counter" class="pill"><span class="cam" style="border-color:var(--ink)"></span><span id="count">0 / 14</span></div>
  <div id="topbtns"><button class="hbtn" id="btn-map">Map</button><button class="hbtn" id="btn-album">Album</button></div>
  <canvas id="minimap"></canvas>
  <div id="banner"><div id="banner-street"></div><div id="banner-city"></div></div>
  <div id="bubble"></div>
  <div id="hint" class="pill"><span class="keys">WASD / arrows to walk · Shift to run · drag to look · Space for a selfie</span><span class="touchy">Left thumb to walk · drag right side to look · tap the camera for a selfie</span></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="snapbtn"><span class="cam"></span><span id="snaplabel">Take selfie!</span><span class="key">Space</span></button>
</div>

<div id="viewfinder"><div class="rec">● SELFIE</div></div>
<div id="flash"></div>
<div id="polaroid"><img id="polaroid-img" alt="Your new selfie"></div>

<div id="title">
  <div class="snow" id="titlesnow"></div>
  <h1>World<br>Snaps</h1>
  <div class="sub">One city made of everywhere. 14 famous faces. One phone.</div>
  <button class="big" id="btn-start" disabled>Loading…</button>
  <div class="made">Made for Anya · Christmas 2026</div>
</div>

<div class="modal" id="mapmodal"><div class="sheet">
  <button class="x" data-close aria-label="Close">×</button>
  <h2>The map</h2>
  <canvas id="bigmap"></canvas>
</div></div>

<div class="modal" id="albummodal"><div class="sheet">
  <button class="x" data-close aria-label="Close">×</button>
  <h2 id="albumtitle">Anya's Album</h2>
  <div id="albumgrid"></div>
  <div class="row"><button class="ghost" id="btn-reset">Start over</button><button class="big" data-close>Back to exploring</button></div>
</div></div>

<div class="modal" id="lightbox"><img id="lightimg" alt="Selfie"></div>

<div class="modal" id="ending"><div class="snow" id="endsnow"></div><div class="sheet">
  <h2 id="end-title"></h2>
  <div id="end-grid"></div>
  <p id="end-body"></p>
  <div id="end-sign"></div>
  <div class="row" style="justify-content:center"><button class="big" data-close>Keep exploring</button></div>
</div></div>

<script>
  for (const id of ['titlesnow', 'endsnow']) {
    const el = document.getElementById(id);
    for (let i = 0; i < 60; i++) {
      const f = document.createElement('i');
      const s = 4 + Math.random() * 8;
      f.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-duration:${6 + Math.random() * 8}s;animation-delay:${-Math.random() * 14}s`;
      el.appendChild(f);
    }
  }
</script>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
